[package]
name = "download-manager-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "egui download manager UI with a pluggable DownloadEngine adapter"

[dependencies]
dirs = "6"
eframe = "0.37.0"
egui = "0.37.0"
download-manager = { path = "../backend" }
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", features = ["glow"] }
